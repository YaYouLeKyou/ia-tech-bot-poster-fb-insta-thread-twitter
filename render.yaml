# Configuration Render — Agent Twitter Veille IA & Tech
# Type : Background Worker (exécution continue 24/7)
#
# Déploiement :
#   1. Poussez ce dépôt sur GitHub
#   2. Sur Render : New → Blueprint → sélectionnez le dépôt
#   3. Cette configuration crée automatiquement le worker
#   4. Ajoutez les variables d'environnement ci-dessous en secrets

services:
  - type: worker
    name: twitter-agency-news-bot
    runtime: python
    plan: free  # ou starter si besoin de plus de ressources
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      # ── Clés API Twitter (X) V2 ────────────────────────────
      - key: TWITTER_API_KEY
        sync: false  # valeur à renseigner dans le dashboard Render
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false

      # ── Clé API LLM (DeepSeek / OpenAI / Groq) ─────────────
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant

      # ── Planification (optionnel) ──────────────────────────
      # Défaut : 08:30 et 17:30 UTC (2 tweets/jour)
      - key: SCHEDULE_TIMES
        value: "08:30,17:30"

      # ── Fréquence alternative (si SCHEDULE_TIMES est vide) ─
      - key: NEWS_INTERVAL_HOURS
        value: "2"

      # ── Port du serveur web ────────────────────────────────
      - key: WEB_PORT
        value: "5000"

      # ── Mode test au démarrage ─────────────────────────────
      # true = publie un tweet immédiatement au lancement
      - key: TEST_ON_STARTUP
        value: "false"

      # ── Mode simulation (Dry-Run) ──────────────────────────
      # true  = affiche le tweet dans la console, ne publie PAS sur Twitter
      # false = publie réellement sur Twitter (comportement normal)
      - key: DRY_RUN
        value: "false"